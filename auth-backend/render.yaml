services:
  - type: web
    name: stockfx-backend
    env: node
    buildCommand: cd auth-backend && npm ci
    startCommand: cd auth-backend && node src/server-enhanced.js
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://stockfx-frontend.onrender.com
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://stockfx-frontend.onrender.com
